    <div data-palette class="lib:mt-2 lib:mb-2 lib:flex lib:flex-wrap lib:items-center lib:gap-2" aria-label="Palette actuelle">${colors.map((color,i)=>`<span aria-hidden="true" class="lib:block lib:size-4 lib:rounded-[5px] lib:border lib:border-solid lib:border-[var(--lib-line)] ${i===9?'lib:outline-2 lib:outline-offset-2 lib:outline-[#4079e8]':''}" style="background:${color}"></span>`).join('')}<span class="lib:relative lib:flex lib:items-center lib:gap-1.5 lib:rounded-lg lib:border lib:border-solid lib:border-[var(--lib-soft-line)] lib:p-1"><span class="lib:size-3.5 lib:rounded lib:border lib:border-dashed lib:border-[var(--lib-soft-line)]"></span><span class="lib:size-3.5 lib:rounded lib:border lib:border-dashed lib:border-[var(--lib-soft-line)]"></span><span class="lib:size-3.5 lib:rounded lib:border lib:border-dashed lib:border-[var(--lib-soft-line)]"></span><span class="lib:absolute lib:-right-1 lib:-bottom-1 lib:flex lib:size-3.5 lib:items-center lib:justify-center lib:rounded-full lib:bg-[var(--lib-surface)] lib:text-[var(--lib-muted)]">${icon('pencil')}</span></span></div>
    <div data-status role="status" aria-live="polite" class="lib:mt-2 lib:flex lib:min-h-7 lib:items-center lib:gap-1.5 lib:border-0 lib:border-t lib:border-solid lib:border-[var(--lib-line)] lib:pt-2 lib:text-[11px] lib:text-[var(--lib-muted)]">${icon('grip')}<span>Glisser pour placer · Clic pour ajouter</span></div>`;
  const card = part => `<button type="button" data-part="${esc(part.id)}" aria-label="Ajouter ${esc(part.name)}" data-tooltip="${esc(part.name)}" class="cursor-interaction lib:flex lib:h-[98px] lib:min-w-0 lib:flex-col lib:items-center lib:justify-center lib:gap-0.5 lib:rounded-lg lib:border lib:border-solid lib:border-transparent lib:bg-[var(--lib-surface)] lib:px-1 lib:py-1.5 lib:text-[var(--lib-ink)] lib:transition-colors lib:hover:border-[var(--lib-soft-line)] lib:hover:bg-[var(--lib-hover)]"><img src="${part.src}" alt="" width="80" height="52" class="lib:block lib:h-[52px] lib:w-[80px] lib:max-w-full lib:shrink-0 lib:object-contain lib:pointer-events-none"/><span class="lib:block lib:whitespace-nowrap lib:text-xs lib:font-medium">${esc(part.dimensions)}</span><span class="lib:block lib:h-3.5 lib:max-w-full lib:truncate lib:text-[11px] lib:text-[var(--lib-muted)]">${esc(shortName(part))}</span></button>`;
  const panels = Array.from(root.querySelectorAll('[data-library]'));
  function save() {
    if (!window.openai?.setWidgetState) return;
    const modelContent = {pieceLibraryProposal: Object.fromEntries(Object.entries(states).map(([id,state])=>[id,{width:state.width,query:state.query,category:state.category,open:state.open}]))};
    window.openai.setWidgetState({modelContent,privateContent:{palette:Object.fromEntries(Object.entries(states).map(([id,state])=>[id,state.palette]))}}).catch(()=>{});
  }
  function accept(saved) {
    if (!saved?.modelContent?.pieceLibraryProposal) return;
    for (const key of ['compact','families']) {
      const value = saved.modelContent.pieceLibraryProposal[key];
      if (!value) continue;
      if (Number.isFinite(value.width)) states[key].width=Math.min(440,Math.max(210,value.width));
      if (typeof value.query==='string') states[key].query=value.query.slice(0,100);
      if (value.category==='all'||families.some(f=>f.id===value.category)) states[key].category=value.category;
      if (Array.isArray(value.open)) states[key].open=value.open.filter(id=>families.some(f=>f.id===id));
      if (typeof saved.privateContent?.palette?.[key]==='boolean') states[key].palette=saved.privateContent.palette[key];
    }
  }
  function render(panel) {
    const id=panel.dataset.library, state=states[id];
    panel.style.width=(state.collapsed?48:state.width)+'px';
    panel.querySelector('[data-heading]').hidden=state.collapsed;
    panel.querySelector('[data-count]').hidden=state.collapsed;
    panel.querySelector('[data-header-fields]').hidden=state.collapsed;
    panel.querySelector('[data-footer]').hidden=state.collapsed;
    panel.querySelector('[data-scroll]').hidden=state.collapsed;
    panel.querySelector('[data-collapse]').setAttribute('aria-label',state.collapsed?'Déplier la bibliothèque':'Replier la bibliothèque');
    panel.querySelector('[data-collapse]').innerHTML=icon(state.collapsed?'panel-left-open':'panel-left-close');
    panel.querySelector('[data-palette-toggle]').setAttribute('aria-expanded',String(state.palette));
    panel.querySelector('[data-palette]').hidden=!state.palette;
    panel.querySelector('[data-palette-arrow]').innerHTML=icon(state.palette?'chevron-down':'chevron-right');
    const terms=normalize(state.query).trim().split(/\s+/).filter(Boolean);
    const visible=parts.filter(part=>(state.category==='all'||part.id.startsWith(state.category))&&terms.every(term=>normalize(part.name+' '+part.id).includes(term)));
    panel.querySelector('[data-count]').textContent=visible.length;
    panel.querySelector('[data-scroll]').innerHTML=visible.length ? families.map(family=>{
      const list=visible.filter(part=>part.id.startsWith(family.id));
      if(!list.length) return '';
      const open=id==='compact'||terms.length>0||state.open.includes(family.id);
      const heading=id==='compact'
        ? `<div class="lib:sticky lib:top-0 lib:z-10 lib:mb-1.5 lib:flex lib:items-center lib:gap-1.5 lib:bg-[var(--lib-canvas)] lib:px-1 lib:py-2 lib:text-xs lib:font-medium"><span>${family.name}</span><span class="lib:text-[11px] lib:text-[var(--lib-muted)] lib:tabular-nums">${list.length}</span></div>`
        : `<button data-family="${family.id}" type="button" aria-expanded="${open}" class="cursor-interaction lib:mb-1 lib:flex lib:w-full lib:items-center lib:gap-2 lib:rounded-md lib:border-0 lib:bg-transparent lib:px-1.5 lib:py-2.5 lib:text-left lib:text-xs lib:font-medium lib:text-[var(--lib-ink)] lib:hover:bg-[var(--lib-hover)]">${icon(open?'chevron-down':'chevron-right')}<span>${family.name}</span><span class="lib:ml-auto lib:text-[11px] lib:text-[var(--lib-muted)] lib:tabular-nums">${list.length}</span></button>`;
      return `<section class="lib:mb-2">${heading}${open?`<div class="lib:grid lib:grid-cols-[repeat(auto-fill,minmax(82px,1fr))] lib:gap-1.5">${list.map(card).join('')}</div>`:''}</section>`;
    }).join('') : `<p class="lib:my-8 lib:px-2 lib:text-center lib:text-xs lib:text-[var(--lib-muted)]">Aucune pièce correspondante.</p>`;
    if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
  }
  accept(window.openai?.widgetState);
  for (const panel of panels) {
    const id=panel.dataset.library;
    panel.querySelector('[data-footer]').innerHTML=footer;
    const search=panel.querySelector('[data-search]'); search.value=states[id].query;
    search.addEventListener('input',()=>{states[id].query=search.value;panel.querySelector('[data-scroll]').scrollTop=0;render(panel);save();});
    const select=panel.querySelector('[data-category]');
    if(select){select.innerHTML='<option value="all">Toutes les familles</option>'+families.map(f=>`<option value="${f.id}">${f.name} · ${parts.filter(p=>p.id.startsWith(f.id)).length}</option>`).join('');select.value=states[id].category;select.addEventListener('change',()=>{states[id].category=select.value;panel.querySelector('[data-scroll]').scrollTop=0;render(panel);save();});}
    panel.querySelector('[data-collapse]').addEventListener('click',()=>{states[id].collapsed=!states[id].collapsed;render(panel);});
    panel.querySelector('[data-palette-toggle]').addEventListener('click',()=>{states[id].palette=!states[id].palette;render(panel);save();});
    panel.querySelector('[data-scroll]').addEventListener('click',event=>{
      const family=event.target.closest('[data-family]');
      if(family){const group=family.dataset.family;states[id].open=states[id].open.includes(group)?states[id].open.filter(f=>f!==group):[...states[id].open,group];render(panel);panel.querySelector('[data-family="'+group+'"]').focus({preventScroll:true});save();return;}
      const piece=event.target.closest('[data-part]');
      if(piece){const part=parts.find(p=>p.id===piece.dataset.part);panel.querySelector('[data-status] span').textContent='Ajout : '+part.name;}
    });
    render(panel);
    if(globalThis.Tweak){const tweak=new Tweak({container:panel,onChange:()=>{render(panel);save();}});tweak.addSlider(states[id],'width',{label:'Largeur du panneau',min:210,max:440,step:10,unit:'px'});}
  }
  window.addEventListener('openai:set_globals',event=>{
    if(!event.detail?.globals?.widgetState)return;
    const previous=JSON.stringify(states);
    accept(event.detail.globals.widgetState);
    if(previous===JSON.stringify(states))return;
    for(const panel of panels){panel.querySelector('[data-search]').value=states[panel.dataset.library].query;const select=panel.querySelector('[data-category]');if(select)select.value=states[panel.dataset.library].category;render(panel);}
  });
})();
</script>
